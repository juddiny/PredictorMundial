<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — World Cup Predictor</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- Noise overlay -->
  <div class="noise"></div>

  <!-- Floating soccer balls decoration -->
  <div class="floating-balls" id="floatingBalls"></div>

  <!-- Alert container (top right) -->
  <div id="alertContainer"></div>

  <!-- Main -->
  <div class="container-main">
    <div class="card-container">

      <!-- Logo -->
      <div class="auth-logo">
        <div style="font-size:3rem; margin-bottom:0.5rem;">⚽</div>
        <h1>WORLD CUP<br>PREDICTOR</h1>
        <p>Predice los resultados de los mejores partidos</p>
      </div>

      <!-- Form -->
      <form id="loginForm" autocomplete="off">

        <div class="form-group">
          <label for="username" class="form-label">Usuario</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Ingresa tu usuario"
            required
            minlength="3"
            autocomplete="username"
          >
          <div class="error-message" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            required
            minlength="6"
            autocomplete="current-password"
          >
          <div class="error-message" id="passwordError"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span id="btnText">Iniciar Sesión</span>
          <span id="btnSpinner" class="spinner" style="display:none;"></span>
        </button>

      </form>

      <div class="section-divider">o</div>

      <div class="link-auth">
        <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script>
    /* ---- Floating balls decoration ---- */
    (function spawnBalls() {
      const container = document.getElementById('floatingBalls');
      const emojis = ['⚽','🏆','⚽','🥅','⚽','🎯','⚽'];
      for (let i = 0; i < 14; i++) {
        const s = document.createElement('span');
        s.textContent = emojis[i % emojis.length];
        s.style.cssText = `
          left: ${Math.random() * 100}%;
          animation-duration: ${12 + Math.random() * 20}s;
          animation-delay: ${Math.random() * 15}s;
          font-size: ${1 + Math.random() * 1.5}rem;
        `;
        container.appendChild(s);
      }
    })();

    /* ---- Alert ---- */
    function showAlert(message, type = 'danger') {
      const alertContainer = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type} alert-dismissible fade show`;
      alert.innerHTML = `
        <span>${message}</span>
        <button type="button" class="btn-close" onclick="this.parentElement.remove()">✕</button>
      `;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alert);
      setTimeout(() => { if (alert.parentElement) alert.remove(); }, 5000);
    }

    /* ---- Validation ---- */
    function showErrorMessage(id, msg) {
      const el = document.getElementById(id);
      if (el) { el.textContent = msg; el.classList.add('show'); }
    }

    function clearErrorMessages() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.textContent = ''; el.classList.remove('show');
      });
    }

    function validateForm() {
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      let isValid = true;
      if (!username.value || username.value.length < 3) {
        showErrorMessage('usernameError', 'Usuario debe tener al menos 3 caracteres');
        isValid = false;
      }
      if (!password.value || password.value.length < 6) {
        showErrorMessage('passwordError', 'Contraseña debe tener al menos 6 caracteres');
        isValid = false;
      }
      return isValid;
    }

    /* ---- Submit ---- */
    const loginForm   = document.getElementById('loginForm');
    const submitBtn   = document.getElementById('submitBtn');
    const btnText     = document.getElementById('btnText');
    const btnSpinner  = document.getElementById('btnSpinner');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrorMessages();

      if (!validateForm()) return;

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        await authManager.login(username, password);
        showAlert('¡Bienvenido! Redirigiendo...', 'success');
        setTimeout(() => { window.location.href = '../html/dashboard.html'; }, 1000);

      } catch (error) {
        debugLog('Error en login', error);
        let errorMessage = error?.message || 'Error al iniciar sesión. Intenta nuevamente.';
        const em = errorMessage.toLowerCase();
        if (em.includes('failed to fetch') || em.includes('network')) {
          errorMessage = 'Error de conexión. Verifica que el backend esté corriendo y accesible desde este equipo.';
        }
        showAlert(errorMessage, 'danger');
      } finally {
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });

    /* ---- Clear errors on input ---- */
    document.getElementById('username').addEventListener('input', () =>
      document.getElementById('usernameError').classList.remove('show'));
    document.getElementById('password').addEventListener('input', () =>
      document.getElementById('passwordError').classList.remove('show'));

    /* ---- Redirect if already authenticated ---- */
    window.addEventListener('load', () => {
      if (authManager.isAuthenticated() && !authManager.isTokenExpired()) {
        window.location.href = '../html/dashboard.html';
      }
    });
  </script>
</body>
</html>
