<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — World Cup Predictor</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="noise"></div>
  <div class="floating-balls" id="floatingBalls"></div>
  <div id="alertContainer"></div>

  <div class="container-main">
    <div class="card-container" style="max-width:520px;">

      <div class="auth-logo">
        <div style="font-size:2.5rem; margin-bottom:0.5rem;">🏆</div>
        <h1>WORLD CUP<br>PREDICTOR</h1>
        <p>Únete y comienza a predecir resultados</p>
      </div>

      <form id="registerForm" autocomplete="off">

        <div class="form-group">
          <label for="name" class="form-label">Nombre Completo</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            placeholder="Ingresa tu nombre completo"
            required
            minlength="3"
          >
          <div class="error-message" id="nameError"></div>
        </div>

        <div class="form-group">
          <label for="username" class="form-label">Usuario</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Elige un nombre de usuario único"
            required
            minlength="3"
            pattern="^[a-zA-Z0-9_-]+$"
          >
          <small class="form-text">Solo letras, números, guiones y guiones bajos</small>
          <div class="error-message" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Mínimo 6 caracteres"
            required
            minlength="6"
          >
          <small class="form-text">Usa mayúsculas, minúsculas y números para mayor seguridad</small>
          <div class="error-message" id="passwordError"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Repite tu contraseña"
            required
            minlength="6"
          >
          <div class="error-message" id="confirmPasswordError"></div>
        </div>

        <!-- Password strength indicator -->
        <div class="form-group">
          <div id="strengthBar" style="height:4px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden; margin-bottom:0.3rem;">
            <div id="strengthFill" style="height:100%; width:0; transition:all 0.4s; border-radius:4px;"></div>
          </div>
          <small id="strengthLabel" class="form-text"></small>
        </div>

        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
          <label class="form-check-label" for="terms">
            Acepto los <a href="#">términos y condiciones</a>
          </label>
          <div class="error-message" id="termsError"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span id="btnText">Crear Cuenta</span>
          <span id="btnSpinner" class="spinner" style="display:none;"></span>
        </button>

      </form>

      <div class="section-divider">o</div>

      <div class="link-auth">
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
      </div>

    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script>
    /* ---- Floating balls ---- */
    (function spawnBalls() {
      const container = document.getElementById('floatingBalls');
      const emojis = ['⚽','🏆','⚽','🥅','⚽','🎯','⚽'];
      for (let i = 0; i < 14; i++) {
        const s = document.createElement('span');
        s.textContent = emojis[i % emojis.length];
        s.style.cssText = `
          left: ${Math.random() * 100}%;
          animation-duration: ${12 + Math.random() * 20}s;
          animation-delay: ${Math.random() * 15}s;
          font-size: ${1 + Math.random() * 1.5}rem;
        `;
        container.appendChild(s);
      }
    })();

    /* ---- Password strength ---- */
    document.getElementById('password').addEventListener('input', function() {
      const v = this.value;
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      let score = 0;
      if (v.length >= 6)  score++;
      if (v.length >= 10) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;

      const levels = [
        { w: '0%',   c: 'transparent', t: '' },
        { w: '25%',  c: '#e63946', t: 'Muy débil' },
        { w: '50%',  c: '#f4a261', t: 'Débil' },
        { w: '75%',  c: '#f5c842', t: 'Buena' },
        { w: '90%',  c: '#2a9d8f', t: 'Fuerte' },
        { w: '100%', c: '#1a6b3a', t: '¡Muy fuerte!' },
      ];
      const lvl = levels[Math.min(score, 5)];
      fill.style.width = v.length ? lvl.w : '0';
      fill.style.background = lvl.c;
      label.textContent = v.length ? lvl.t : '';
    });

    /* ---- Alert ---- */
    function showAlert(message, type = 'danger') {
      const alertContainer = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type} alert-dismissible fade show`;
      alert.innerHTML = `
        <span>${message}</span>
        <button type="button" class="btn-close" onclick="this.parentElement.remove()">✕</button>
      `;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alert);
      setTimeout(() => { if (alert.parentElement) alert.remove(); }, 5000);
    }

    function showErrorMessage(id, msg) {
      const el = document.getElementById(id);
      if (el) { el.textContent = msg; el.classList.add('show'); }
    }

    function clearErrorMessage(id) {
      const el = document.getElementById(id);
      if (el) { el.textContent = ''; el.classList.remove('show'); }
    }

    function clearAllErrorMessages() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.textContent = ''; el.classList.remove('show');
      });
    }

    function validateForm() {
      const name            = document.getElementById('name');
      const username        = document.getElementById('username');
      const password        = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');
      const terms           = document.getElementById('terms');
      const usernamePattern = /^[a-zA-Z0-9_-]+$/;
      let isValid = true;

      if (!name.value || name.value.length < 3) {
        showErrorMessage('nameError', 'Nombre debe tener al menos 3 caracteres');
        isValid = false;
      } else clearErrorMessage('nameError');

      if (!username.value || username.value.length < 3) {
        showErrorMessage('usernameError', 'Usuario debe tener al menos 3 caracteres');
        isValid = false;
      } else if (!usernamePattern.test(username.value)) {
        showErrorMessage('usernameError', 'Solo letras, números, guiones y guiones bajos');
        isValid = false;
      } else clearErrorMessage('usernameError');

      if (!password.value || password.value.length < 6) {
        showErrorMessage('passwordError', 'Contraseña debe tener al menos 6 caracteres');
        isValid = false;
      } else clearErrorMessage('passwordError');

      if (password.value !== confirmPassword.value) {
        showErrorMessage('confirmPasswordError', 'Las contraseñas no coinciden');
        isValid = false;
      } else if (!confirmPassword.value) {
        showErrorMessage('confirmPasswordError', 'Debes confirmar la contraseña');
        isValid = false;
      } else clearErrorMessage('confirmPasswordError');

      if (!terms.checked) {
        showErrorMessage('termsError', 'Debes aceptar los términos y condiciones');
        isValid = false;
      } else clearErrorMessage('termsError');

      return isValid;
    }

    /* ---- Submit ---- */
    const registerForm = document.getElementById('registerForm');
    const submitBtn    = document.getElementById('submitBtn');
    const btnText      = document.getElementById('btnText');
    const btnSpinner   = document.getElementById('btnSpinner');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAllErrorMessages();

      if (!validateForm()) return;

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const name     = document.getElementById('name').value;
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const result = await authManager.register(name, username, password);
        showAlert(result.message || '¡Cuenta creada exitosamente! Redirigiendo...', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);

      } catch (error) {
        debugLog('Error en registro', error);
        let errorMessage = 'Error al crear la cuenta. Intenta nuevamente.';
        if (error.message.includes('Usuario ya existe'))  errorMessage = 'El usuario ya está registrado. Intenta con otro.';
        else if (error.message.includes('Email ya existe')) errorMessage = 'Este email ya está registrado.';
        else if (error.message.includes('network'))        errorMessage = 'Error de conexión. Verifica tu internet.';
        showAlert(errorMessage, 'danger');
      } finally {
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });

    /* ---- Clear on input ---- */
    ['name', 'username', 'password', 'confirmPassword'].forEach(id => {
      document.getElementById(id).addEventListener('input', () =>
        clearErrorMessage(id + 'Error'));
    });

    /* ---- Redirect if authenticated ---- */
    window.addEventListener('load', () => {
      if (authManager.isAuthenticated() && !authManager.isTokenExpired()) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
